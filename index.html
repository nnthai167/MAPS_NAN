<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f5132">
<title>Bản đồ trạm sạc & đổi pin — Nghệ An</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet MarkerCluster -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

<!-- SheetJS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#0b1f16',
          moss: {50:'#f2f8f4',100:'#dfeee5',200:'#b9dcc6',300:'#8bc4a1',400:'#5aa87c',500:'#398a5f',600:'#286f4a',700:'#20573c',800:'#1b4531',900:'#173a29'},
          amber: {50:'#fff8ec',100:'#ffedc7',200:'#ffd98a',300:'#ffbd4d',400:'#ffa11f',500:'#f78406',600:'#d86602',700:'#b34d05',800:'#8f3d0b',900:'#75330d'}
        },
        fontFamily: {
          sans: ['"Be Vietnam Pro"','system-ui','-apple-system','Segoe UI','Roboto','sans-serif'],
        }
      }
    }
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  html, body { height: 100%; overscroll-behavior: none; }
  body { font-family: 'Be Vietnam Pro', system-ui, sans-serif; }
  #map { height: 100%; width: 100%; background:#e7efe9; }
  .leaflet-popup-content-wrapper { border-radius: 14px; padding: 0; overflow: hidden; }
  .leaflet-popup-content { margin: 0; width: 260px !important; }
  .leaflet-popup-tip { background: #fff; }
  .station-marker { display:flex; align-items:center; justify-content:center; border-radius: 999px; box-shadow: 0 2px 6px rgba(0,0,0,.35); border: 2px solid #fff; font-size: 15px; }
  .marker-cluster-custom { background: transparent !important; }
  .cluster-pill { display:flex; align-items:center; justify-content:center; width:100%; height:100%; border-radius:999px; color:#fff; font-weight:700; font-size:13px; box-shadow:0 2px 8px rgba(0,0,0,.35); border:2px solid #fff; }
  .tab-underline { position: relative; }
  .tab-underline.active::after { content:''; position:absolute; left:14%; right:14%; bottom:-1px; height:3px; border-radius:3px; background:#286f4a; }
  .scrollbar-thin::-webkit-scrollbar { width: 5px; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background:#c7d9cd; border-radius:4px; }
  .btn-press:active { transform: scale(0.96); }
  .chip { transition: all .15s ease; }
  #locateBtn.locating svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade-in { animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(6px);} to { opacity:1; transform:none; } }
  input[type="file"] { display:none; }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
</style>
</head>
<body class="bg-moss-50 text-ink">

<div class="flex flex-col h-[100dvh] overflow-hidden">

  <!-- Header -->
  <header class="shrink-0 bg-moss-800 text-white px-4 pt-[calc(env(safe-area-inset-top)+10px)] pb-3 shadow-md z-[1000]">
    <div class="flex items-center justify-between gap-3">
      <div class="min-w-0">
        <h1 class="text-[17px] font-bold leading-tight truncate">Trạm sạc & đổi pin — Nghệ An</h1>
        <p class="text-[11.5px] text-moss-200 mt-0.5" id="statSummary">Đang tải dữ liệu…</p>
      </div>
      <label id="uploadBtn" class="btn-press shrink-0 flex flex-col items-center justify-center w-11 h-11 rounded-full bg-moss-700 active:bg-moss-600 cursor-pointer" title="Tải file Excel/CSV">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-moss-100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/><polyline points="7 9 12 4 17 9"/><line x1="12" y1="4" x2="12" y2="16"/></svg>
        <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" />
      </label>
    </div>

    <!-- Search -->
    <div class="mt-3 relative">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-moss-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Tìm theo mã trạm hoặc tên trạm..."
        class="w-full bg-moss-900/40 focus:bg-white focus:text-ink placeholder-moss-300 focus:placeholder-gray-400 text-sm rounded-xl pl-9 pr-9 py-2.5 outline-none transition-colors border border-moss-600 focus:border-moss-300"/>
      <button id="clearSearch" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-moss-300 hover:text-white">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Filter chips -->
    <div class="mt-2.5 flex items-center gap-2 overflow-x-auto scrollbar-thin -mx-4 px-4 pb-0.5">
      <button data-filter="all" class="chip-filter chip shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full bg-white text-moss-800">Tất cả</button>
      <button data-filter="charging" class="chip-filter chip shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full bg-moss-700 text-moss-100 flex items-center gap-1">⚡ Trạm sạc</button>
      <button data-filter="swap" class="chip-filter chip shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full bg-moss-700 text-moss-100 flex items-center gap-1">🔋 Đổi pin</button>
      <button id="locateBtn" class="chip shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full bg-amber-500 text-white flex items-center gap-1 ml-auto">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M22 12h-3M5 12H2"/></svg>
        Vị trí của tôi
      </button>
    </div>
  </header>

  <!-- Tabs -->
  <nav class="shrink-0 bg-white border-b border-moss-100 flex text-sm font-semibold z-[900]">
    <button data-tab="map" class="tab-underline active flex-1 py-3 text-moss-800">🗺️ Bản đồ</button>
    <button data-tab="list" class="tab-underline flex-1 py-3 text-gray-400">📋 Danh sách trạm</button>
  </nav>

  <!-- Content -->
  <main class="relative flex-1 min-h-0">

    <!-- Map view -->
    <section id="view-map" class="absolute inset-0">
      <div id="map"></div>
      <div id="mapLoading" class="absolute inset-0 flex items-center justify-center bg-moss-50/70 pointer-events-none">
        <div class="text-moss-600 text-sm font-medium">Đang tải bản đồ…</div>
      </div>
    </section>

    <!-- List view -->
    <section id="view-list" class="absolute inset-0 hidden overflow-y-auto scrollbar-thin bg-moss-50">
      <div id="listContainer" class="p-3 space-y-2.5 safe-bottom"></div>
      <div id="listEmpty" class="hidden flex-col items-center justify-center text-center px-8 py-16 text-gray-400">
        <div class="text-4xl mb-2">🔍</div>
        <p class="text-sm">Không tìm thấy trạm phù hợp.</p>
      </div>
    </section>

  </main>
</div>

<!-- Toast -->
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-6 bg-ink text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-[2000]"></div>

function stripDiacritics(str){
  return (str||'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
}
function haversine(lat1, lon1, lat2, lon2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function formatDistance(km){
  if (km == null) return '';

}

  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>{ t.style.opacity='0'; }, duration);
}
function typeMeta(type){
  return type === 'swap'
    ? { label: 'Trạm đổi pin', emoji: '🔋', color: '#d86602', bg:'bg-amber-50', text:'text-amber-700', ring:'ring-amber-200' }
    : { label: 'Trạm sạc', emoji: '⚡', color: '#20573c', bg:'bg-moss-50', text:'text-moss-700', ring:'ring-moss-200' };
}

/* ============ 4. MAP INIT ============ */
function initMap(){
  map = L.map('map', { zoomControl:false, attributionControl:true }).setView([18.85, 105.35], 9);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    subdomains: 'abcd',
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  clusterGroup = L.markerClusterGroup({
    maxClusterRadius: 50,
    iconCreateFunction: function(cluster){
      const count = cluster.getChildCount();
      const size = count < 10 ? 34 : count < 30 ? 40 : 48;
      return L.divIcon({
        html: `<div class="cluster-pill" style="background:#20573c;">${count}</div>`,
        className: 'marker-cluster-custom',
        iconSize: [size, size]
      });
    }
  });
  map.addLayer(clusterGroup);
  document.getElementById('mapLoading').remove();
}

function makeIcon(type){
  const meta = typeMeta(type);
  return L.divIcon({
    html: `<div class="station-marker" style="width:30px;height:30px;background:${meta.color};">${meta.emoji}</div>`,
    className: '',
    iconSize: [30,30],
    iconAnchor: [15,15],
    popupAnchor: [0,-14]
  });
}

function popupHtml(s){
  const meta = typeMeta(s.type);
  return `
    <div class="p-3.5">
      <div class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full mb-1.5" style="background:${s.type==='swap'?'#fff3e0':'#e9f4ee'};color:${meta.color}">
        ${meta.emoji} ${meta.label}
      </div>
      <div class="text-xs text-gray-400 font-medium">${s.code}</div>
      <div class="font-bold text-[14px] leading-snug text-ink mt-0.5">${s.name || '(Chưa có tên)'}</div>
      <div class="text-[12.5px] text-gray-500 mt-1 leading-snug">${s.address || ''}</div>
      <a href="${gmapsUrl(s.lat,s.lng)}" target="_blank" rel="noopener"
        class="mt-3 flex items-center justify-center gap-1.5 w-full text-white text-[13px] font-semibold py-2 rounded-lg"
        style="background:${meta.color}">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
        Chỉ đường Google Maps
      </a>
    </div>`;
}

function rebuildMarkers(){
  clusterGroup.clearLayers();
  for (const key in markerByCode) delete markerByCode[key];
  const filtered = getFilteredStations();
  filtered.forEach(s => {
    if (typeof s.lat !== 'number' || typeof s.lng !== 'number') return;
    const marker = L.marker([s.lat, s.lng], { icon: makeIcon(s.type) });
    marker.bindPopup(popupHtml(s));
    marker.stationCode = s.code;
    markerByCode[s.code] = marker;
    clusterGroup.addLayer(marker);
  });
}

function focusStation(code){
  const s = stations.find(x => x.code === code);
  if (!s) return;
  currentTab = 'map';
  applyTabUI();
  map.setView([s.lat, s.lng], 16, { animate: true });
  setTimeout(() => {
    const m = markerByCode[code];
    if (m) m.openPopup();
  }, 300);
}

/* ============ 5. FILTER / SEARCH ============ */
function getFilteredStations(){
  let list = stations.filter(s => typeof s.lat === 'number' && typeof s.lng === 'number');
  if (activeFilter !== 'all') list = list.filter(s => s.type === activeFilter);
  if (searchTerm){
    const q = stripDiacritics(searchTerm);
    list = list.filter(s => stripDiacritics(s.code).includes(q) || stripDiacritics(s.name).includes(q) || stripDiacritics(s.address).includes(q));
  }
  if (userPos){
    list = list.map(s => ({...s, _dist: haversine(userPos.lat, userPos.lng, s.lat, s.lng)}));
    list.sort((a,b) => a._dist - b._dist);
  } else {
    list = list.map(s => ({...s, _dist: null}));
  }
  return list;
}

/* ============ 6. LIST RENDER ============ */
function renderList(){
  const container = document.getElementById('listContainer');
  const empty = document.getElementById('listEmpty');
  const list = getFilteredStations();

  if (list.length === 0){
    container.innerHTML = '';
    empty.classList.remove('hidden');
    empty.classList.add('flex');
    return;
  }
  empty.classList.add('hidden');
  empty.classList.remove('flex');

  container.innerHTML = list.map(s => {
    const meta = typeMeta(s.type);
    return `
    <div class="fade-in bg-white rounded-2xl p-3.5 shadow-sm ring-1 ${meta.ring} flex flex-col gap-2" data-code="${s.code}">
      <div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="inline-flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full ${meta.bg} ${meta.text}">${meta.emoji} ${meta.label}</span>
            ${s._dist != null ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600">📍 ${formatDistance(s._dist)}</span>` : ''}
          </div>
          <div class="text-[11px] text-gray-400 font-medium mt-1">${s.code}</div>
          <div class="font-bold text-[14.5px] text-ink leading-snug mt-0.5">${s.name || '(Chưa có tên)'}</div>
          <div class="text-[12.5px] text-gray-500 leading-snug mt-0.5">${s.address || ''}</div>
        </div>
      </div>
      <div class="flex gap-2 mt-0.5">
        <button class="btn-press view-on-map-btn flex-1 text-[12.5px] font-semibold py-2 rounded-lg bg-moss-50 text-moss-800 flex items-center justify-center gap-1" data-code="${s.code}">
          🗺️ Xem trên bản đồ
        </button>
        <a href="${gmapsUrl(s.lat,s.lng)}" target="_blank" rel="noopener" class="btn-press flex-1 text-[12.5px] font-semibold py-2 rounded-lg text-white text-center flex items-center justify-center gap-1" style="background:${meta.color}">
          🧭 Chỉ đường
        </a>
      </div>
    </div>`;
  }).join('');

  container.querySelectorAll('.view-on-map-btn').forEach(btn => {
    btn.addEventListener('click', () => focusStation(btn.dataset.code));
  });
}

/* ============ 7. UI: TABS / CHIPS / SEARCH ============ */
function applyTabUI(){
  document.querySelectorAll('[data-tab]').forEach(btn => {
    const active = btn.dataset.tab === currentTab;
    btn.classList.toggle('active', active);
    btn.classList.toggle('text-moss-800', active);
    btn.classList.toggle('text-gray-400', !active);
  });
  document.getElementById('view-map').classList.toggle('hidden', currentTab !== 'map');
  document.getElementById('view-list').classList.toggle('hidden', currentTab !== 'list');
  if (currentTab === 'map') setTimeout(() => map.invalidateSize(), 50);
  if (currentTab === 'list') renderList();
}

document.querySelectorAll('[data-tab]').forEach(btn => {
  btn.addEventListener('click', () => { currentTab = btn.dataset.tab; applyTabUI(); });
});

document.querySelectorAll('.chip-filter').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.chip-filter').forEach(b => {
      const on = b === btn;
      b.classList.toggle('bg-white', on);
      b.classList.toggle('text-moss-800', on);
      b.classList.toggle('bg-moss-700', !on);
      b.classList.toggle('text-moss-100', !on);
    });
    rebuildMarkers();
    if (currentTab === 'list') renderList();
    updateSummary();
  });
});

const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');
searchInput.addEventListener('input', () => {
  searchTerm = searchInput.value.trim();
  clearSearchBtn.classList.toggle('hidden', !searchTerm);
  rebuildMarkers();
  if (currentTab === 'list') renderList();
  updateSummary();
});
clearSearchBtn.addEventListener('click', () => {
  searchInput.value = ''; searchTerm = '';
  clearSearchBtn.classList.add('hidden');
  rebuildMarkers();
  if (currentTab === 'list') renderList();
  updateSummary();
});

function updateSummary(){
  const list = getFilteredStations();
  const charging = stations.filter(s=>s.type==='charging').length;
  const swap = stations.filter(s=>s.type==='swap').length;
  document.getElementById('statSummary').textContent =
    `${list.length}/${stations.length} trạm hiển thị · ⚡ ${charging} trạm sạc · 🔋 ${swap} trạm đổi pin`;
}

/* ============ 8. GEOLOCATION ============ */
const locateBtn = document.getElementById('locateBtn');
locateBtn.addEventListener('click', () => {
  if (!navigator.geolocation){
    showToast('Trình duyệt không hỗ trợ định vị GPS');
    return;
  }
  locateBtn.classList.add('locating');
  navigator.geolocation.getCurrentPosition(
    pos => {
      userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      locateBtn.classList.remove('locating');
      showToast('Đã lấy vị trí — danh sách đã sắp xếp theo khoảng cách');

      if (window._userMarker) map.removeLayer(window._userMarker);
      window._userMarker = L.circleMarker([userPos.lat, userPos.lng], {
        radius: 8, color:'#fff', weight:3, fillColor:'#2563eb', fillOpacity:1
      }).addTo(map).bindPopup('Vị trí của bạn');
      map.setView([userPos.lat, userPos.lng], 13);

      renderList();
      currentTab = 'list';
      applyTabUI();
    },
    err => {
      locateBtn.classList.remove('locating');
      showToast('Không thể lấy vị trí: ' + (err.message || 'đã từ chối quyền truy cập'));
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

/* ============ 9. IMPORT EXCEL/CSV (SheetJS) ============ */
const NAME_MAP = {
  code: ['ma tram','matram','code','ma_tram','station code','station_code','id'],
  name: ['ten tram','tentram','name','ten_tram','station name'],
  address: ['dia chi','diachi','address'],
  lat: ['lat','latitude','vi do','vido'],
  lng: ['lng','lon','long','longitude','kinh do','kinhdo'],
  type: ['loai','type','loai tram']
};
function matchColumn(headers, keys){
  const normHeaders = headers.map(h => stripDiacritics(String(h||'')).replace(/[^a-z0-9]/g,''));
  for (const key of keys){
    const normKey = stripDiacritics(key).replace(/[^a-z0-9]/g,'');
    const idx = normHeaders.findIndex(h => h === normKey || h.includes(normKey));
    if (idx !== -1) return idx;
  }
  return -1;
}

document.getElementById('fileInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try {
      const wb = XLSX.read(evt.target.result, { type: 'binary' });
      const firstSheet = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1, defval: '' });
      if (rows.length < 2) { showToast('File không có dữ liệu'); return; }

      const headers = rows[0];
      const idxCode = matchColumn(headers, NAME_MAP.code);
      const idxName = matchColumn(headers, NAME_MAP.name);
      const idxAddr = matchColumn(headers, NAME_MAP.address);
      const idxLat = matchColumn(headers, NAME_MAP.lat);
      const idxLng = matchColumn(headers, NAME_MAP.lng);
      const idxType = matchColumn(headers, NAME_MAP.type);

      if (idxLat === -1 || idxLng === -1){
        showToast('Không tìm thấy cột Lat/Lng trong file');
        return;
      }

      const imported = [];
      for (let i = 1; i < rows.length; i++){
        const r = rows[i];
        const lat = parseFloat(r[idxLat]);
        const lng = parseFloat(r[idxLng]);
        if (isNaN(lat) || isNaN(lng)) continue;
        imported.push({
          code: idxCode !== -1 ? String(r[idxCode]) : `ROW-${i}`,
          name: idxName !== -1 ? String(r[idxName]) : '',
          address: idxAddr !== -1 ? String(r[idxAddr]) : '',
          type: idxType !== -1 && stripDiacritics(String(r[idxType])).includes('doi pin') ? 'swap' : 'charging',
          lat, lng, count: 1
        });
      }

      if (imported.length === 0){
        showToast('Không đọc được trạm hợp lệ nào từ file');
        return;
      }

      stations = imported;
      userPos = null;
      searchInput.value = ''; searchTerm = '';
      activeFilter = 'all';
      document.querySelectorAll('.chip-filter').forEach(b => {
        const on = b.dataset.filter === 'all';
        b.classList.toggle('bg-white', on);
        b.classList.toggle('text-moss-800', on);
        b.classList.toggle('bg-moss-700', !on);
        b.classList.toggle('text-moss-100', !on);
      });

      rebuildMarkers();
      renderList();
      updateSummary();
      if (stations.length){
        const bounds = L.latLngBounds(stations.map(s => [s.lat, s.lng]));
        map.fitBounds(bounds, { padding: [30,30] });
      }
      showToast(`Đã tải ${imported.length} trạm từ file`);
    } catch(err){
      console.error(err);
      showToast('Lỗi khi đọc file: định dạng không hợp lệ');
    }
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
});

/* ============ 10. INIT ============ */
initMap();
rebuildMarkers();
updateSummary();
applyTabUI();
</script>
